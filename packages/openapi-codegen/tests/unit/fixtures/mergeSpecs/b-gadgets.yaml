openapi: 3.0.3
tags:
  - name: Gadgets
paths:
  /gadgets:
    get:
      operationId: listGadgets
      tags: [Gadgets]
      parameters:
        - $ref: './a-widgets.yaml#/components/parameters/ProjectId'
        - $ref: '../mergeShared/catalog.yaml#/components/parameters/CatalogId'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: './a-widgets.yaml#/components/schemas/Widget'
components:
  schemas:
    Gadget:
      type: object
      properties:
        widget:
          # Answered by the merged namespace: `Widget` is declared in
          # a-widgets.yaml, not here.
          $ref: '#/components/schemas/Widget'
        catalog:
          $ref: '../mergeShared/catalog.yaml#/components/schemas/Catalog'
