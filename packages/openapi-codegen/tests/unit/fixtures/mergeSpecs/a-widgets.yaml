openapi: 3.0.3
servers:
  - url: https://api.example.com
tags:
  - name: Widgets
paths:
  /widgets:
    get:
      operationId: listWidgets
      tags: [Widgets]
      responses:
        '200':
          $ref: './a-widgets.yaml#/components/responses/WidgetList'
    post:
      operationId: createWidget
      tags: [Widgets]
      requestBody:
        # A section the merge does not carry: a same-file ref to one is left
        # alone rather than treated as something to pull.
        $ref: '#/components/requestBodies/CreateWidget'
      responses:
        '201':
          description: created
components:
  requestBodies:
    CreateWidget:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Widget'
  schemas:
    Widget:
      type: object
      properties:
        id:
          type: string
  responses:
    WidgetList:
      description: A list of widgets
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
