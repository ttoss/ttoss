openapi: 3.0.3
info:
  title: Orders
  version: 1.0.0
paths:
  /orders:
    get:
      operationId: listOrders
      responses:
        '200':
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
              example:
                - items:
                    - sku: a
components:
  schemas:
    Order:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              sku:
                type: string
        tags:
          type: [array, 'null']
          items:
            type: string
        default:
          type: string
      x-sample:
        items: {}
    items:
      type: object
      properties:
        sku:
          type: string
