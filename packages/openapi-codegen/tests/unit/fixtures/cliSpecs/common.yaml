      schema:
        $ref: './primitives.yaml#/components/schemas/ShortString'
    RegionId:
      $ref: './primitives.yaml#/components/parameters/Region'
  schemas:
    Label:
      $ref: './primitives.yaml#/components/schemas/ShortString'
    Metadata:
      description: Arbitrary metadata, an object or the JSON text of one
      oneOf:
        - type: object
        - type: string
