openapi: 3.0.3
tags:
  - name: Widgets
paths:
  /projects/{project_id}/widgets:
    parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
      - name: x_tenant_id
        in: header
        required: true
        description: Tenant the widget belongs to
        schema:
          type: string
    get:
      operationId: listWidgets
      tags: [Widgets]
      summary: List widgets
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: session
          in: cookie
          description: Opaque session cookie
          schema:
            type: string
      responses:
        '200':
          description: ok
    post:
      operationId: createWidget
      tags: [Widgets]
      description: Create a new widget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Widget name
                color:
                  type: string
                  description: Widget color
components: {}
