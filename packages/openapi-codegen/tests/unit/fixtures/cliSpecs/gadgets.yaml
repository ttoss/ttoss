openapi: 3.0.3
tags:
  - name: Gadgets
paths:
  /gadgets:
    put:
      operationId: replaceOrCreateGadget
      tags: [Gadgets]
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [id, name]
                  properties:
                    id:
                      type: string
                      description: Existing gadget id
                    name:
                      type: string
                      description: Gadget name
                - type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                      description: Gadget name
      responses:
        '200':
          description: ok
  /gadgets/links:
    post:
      operationId: linkGadget
      tags: [Gadgets]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  description: Link label
                gadget_id:
                  type: string
                  description: Gadget to link
                gadget_name:
                  type: string
                  description: Gadget to link, by name
              oneOf:
                - required: [gadget_id]
                - required: [gadget_name]
      responses:
        '200':
          description: ok
components: {}
