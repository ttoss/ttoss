packages:
  - 'docs/*'
  - 'examples/*'
  - 'fixtures/*'
  - 'packages/*'
minimumReleaseAge: 1440
blockExoticSubdeps: true
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  aws-sdk: false
  core-js: false
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
  unrs-resolver: false

trustPolicy: no-downgrade
trustPolicyExclude:
  # https://github.com/storybookjs/storybook/issues/34957
  # https://github.com/TypeStrong/fork-ts-checker-webpack-plugin/issues/895
  - chokidar
  # Docusaurus dependencies
  - detect-port
  # Relay/fbjs
  - ua-parser-js
  # tsdown, lint-staged, @commitlint/cli, @lerna-lite/core, Docusaurus mermaid path
  - tinyexec
  # semver@6.3.1 comes from Babel stack, especially @babel/core
  - semver

overrides:
  # 7.4.6 trips `trustPolicy: no-downgrade` (ERR_PNPM_TRUST_DOWNGRADE). Keep the
  # last trusted 7.x until upstream restores provenance.
  webpack-dev-middleware@7: 7.4.5
  # TypeScript 7 (native/tsgo) ships no JS compiler API yet, which
  # typescript-eslint, typedoc and @formatjs/ts-transformer depend on. Pin
  # auto-installed peers too, so tsdown/jest don't resolve 7.x.
  typescript: ~6.0.3
  # Match the Node.js 24 runtime (`engines`); transitive `@types/node: *` would
  # otherwise pull 26.x next to 24.x and type APIs Node 24 doesn't have.
  '@types/node': ^24.19.2
